[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marksix-research"
version = "2.0.0"
description = "Reproducible shadow research pipeline for Mark Six v2"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "polars>=1.0",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "river>=0.21",
]

[project.scripts]
marksix-research = "marksix_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

